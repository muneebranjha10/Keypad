name: Build Glass Dialer APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || sdkmanager 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Glass-Dialer-beta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlassDialer-v0.5-amoled.apk
          gh release view v0.5-amoled >/dev/null 2>&1 || gh release create v0.5-amoled --prerelease --title 'Glass Dialer v0.5 AMOLED' --notes 'Experimental LSPosed module. Device testing required.'
          gh release upload v0.5-amoled GlassDialer-v0.5-amoled.apk --clobber
