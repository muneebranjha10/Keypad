name: Build Glass Dialer APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager 'platforms;android-35'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || sdkmanager 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test keypad and slider geometry
        run: |
          mkdir -p /tmp/geometry-tests
          javac -d /tmp/geometry-tests app/src/main/java/io/rootvault/glassdialer/Geometry.java tests/GeometryTest.java
          java -cp /tmp/geometry-tests io.rootvault.glassdialer.GeometryTest
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Glass-Dialer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlassDialer-v1.8.apk
          for attempt in 1 2 3 4; do
            if (gh release view v1.8 >/dev/null 2>&1 || gh release create v1.8 --target "$GITHUB_SHA" --title 'Glass Dialer v1.8' --notes 'Glass Dialer by s23_hype. LSPosed required. Includes Telegram welcome and activation guide.') && gh release upload v1.8 GlassDialer-v1.8.apk --clobber; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::warning::Release API unavailable; signed APK remains available in Actions artifacts."
